name: Update TcpQuality Nodes

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch node lists
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p nodes

          for scope in all cernet v4 v6 cdn tos apple6; do
            echo "Updating $scope..."
            curl -fsSL \
              --retry 3 \
              --connect-timeout 10 \
              --max-time 60 \
              "https://tcpquality.ibsgss.uk/getNodes?format=tsv&scope=${scope}" \
              -o "nodes/${scope}.tsv.new"

            test -s "nodes/${scope}.tsv.new"
            mv "nodes/${scope}.tsv.new" "nodes/${scope}.tsv"
          done

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add nodes/

          if git diff --cached --quiet; then
            echo "No node changes."
            exit 0
          fi

          git commit -m "chore: update TcpQuality nodes"
          git push
